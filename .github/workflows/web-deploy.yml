name: Web Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ runner.workspace }}/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze

      - name: Build web app
        run: flutter build web --release --web-renderer html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Extract version information
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *\([^+]*\).*/\1/')
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/.*+\([0-9]*\).*/\1/')
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "TAG_NAME=web_${VERSION_NAME}+${BUILD_NUMBER}_${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION_NAME+$BUILD_NUMBER (commit: $COMMIT_SHA)"

      - name: Deploy to Firebase Hosting (Preview)
        if: github.event_name == 'pull_request'
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: |
          firebase deploy --only hosting --project budget-ss --token "${{ secrets.FIREBASE_TOKEN }}" --message "Deploy preview for PR #${{ github.event.number }}"

      - name: Deploy to Firebase Hosting (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: |
          firebase deploy --only hosting --project budget-ss --token "${{ secrets.FIREBASE_TOKEN }}" --message "Deploy production version ${{ steps.version.outputs.VERSION_NAME }}+${{ steps.version.outputs.BUILD_NUMBER }}"

      - name: Create and push Git tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if tag already exists
          if git rev-parse "${{ steps.version.outputs.TAG_NAME }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.TAG_NAME }} already exists, skipping tag creation"
          else
            git tag -a "${{ steps.version.outputs.TAG_NAME }}" -m "Web Release ${{ steps.version.outputs.VERSION_NAME }}+${{ steps.version.outputs.BUILD_NUMBER }} (commit: ${{ steps.version.outputs.COMMIT_SHA }})"
            git push origin "${{ steps.version.outputs.TAG_NAME }}"
            echo "Created and pushed tag: ${{ steps.version.outputs.TAG_NAME }}"
          fi

      - name: Comment on PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const projectId = 'budget-ss';
            const previewUrl = `https://${projectId}.web.app`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Web Preview Deployed!**\n\n📱 Preview URL: ${previewUrl}\n\n✅ Version: ${{ steps.version.outputs.VERSION_NAME }}+${{ steps.version.outputs.BUILD_NUMBER }}\n🔗 Commit: ${{ steps.version.outputs.COMMIT_SHA }}`
            });

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://budget-ss.web.app
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
