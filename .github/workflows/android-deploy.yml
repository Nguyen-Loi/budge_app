name: Android Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugin-dependencies
            **/.dart_tool/package_config.json
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: |
            android/vendor/bundle
            ~/.gem
          key: gems-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-  

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Decode Google Play JSON
        run: |
          echo "${{ secrets.GOOGLE_PLAY_JSON }}" | base64 -d > android/play-account.json

      - name: Setup key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release bundle
        run: flutter build appbundle --release

      - name: Setup Ruby and install fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: android

      - name: Extract version information
        id: version
        run: |
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | head -n1 | sed 's/.*versionCode \([0-9]*\).*/\1/')
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -n1 | sed 's/.*versionName "\([^"]*\)".*/\1/')
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=GooglePlay_${VERSION_NAME}(${VERSION_CODE})" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION_NAME ($VERSION_CODE)"

      - name: Deploy to Google Play
        env:
          SUPPLY_JSON_KEY: ${{ github.workspace }}/android/play-account.json
        working-directory: android
        run: |
          bundle exec fastlane deploy

      - name: Create and push Git tag
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if tag already exists
          if git rev-parse "${{ steps.version.outputs.TAG_NAME }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.TAG_NAME }} already exists, skipping tag creation"
          else
            git tag -a "${{ steps.version.outputs.TAG_NAME }}" -m "Release ${{ steps.version.outputs.VERSION_NAME }} (Build ${{ steps.version.outputs.VERSION_CODE }})"
            git push origin "${{ steps.version.outputs.TAG_NAME }}"
            echo "Created and pushed tag: ${{ steps.version.outputs.TAG_NAME }}"
          fi
