name: Android Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'  

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Decode Google Play JSON
        run: |
          echo "${{ secrets.GOOGLE_PLAY_JSON }}" | base64 -d > android/play-account.json

      - name: Setup key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release bundle
        run: flutter build appbundle --release

      - name: Install fastlane
        run: |
          sudo gem install fastlane

      - name: Extract version information
        id: version
        run: |
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | head -n1 | sed 's/.*versionCode \([0-9]*\).*/\1/')
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -n1 | sed 's/.*versionName "\([^"]*\)".*/\1/')
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=GooglePlay_${VERSION_NAME}(${VERSION_CODE})" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION_NAME ($VERSION_CODE)"

      - name: Deploy to Google Play
        env:
          SUPPLY_JSON_KEY: ${{ github.workspace }}/android/play-account.json
        working-directory: android
        run: |
          bundle install || true
          fastlane deploy

      - name: Create and push Git tag
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Check if tag already exists
          if git rev-parse "${{ steps.version.outputs.TAG_NAME }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.TAG_NAME }} already exists, skipping tag creation"
          else
            git tag -a "${{ steps.version.outputs.TAG_NAME }}" -m "Release ${{ steps.version.outputs.VERSION_NAME }} (Build ${{ steps.version.outputs.VERSION_CODE }})"
            git push origin "${{ steps.version.outputs.TAG_NAME }}"
            echo "Created and pushed tag: ${{ steps.version.outputs.TAG_NAME }}"
          fi
